<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contoh pemuatan data proyek dan artikel berbahasa Indonesia secara asynchronous menggunakan Fetch API, Promise, dan JSON."
    />
    <title>Proyek dan Artikel | Asynchronous JavaScript</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      body {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }

      header,
      main {
        margin-bottom: 2rem;
      }

      h1,
      h2 {
        color: #1d3a8c;
      }

      #status-state {
        min-height: 1.5em;
        font-weight: 600;
      }

      #list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
        gap: 1rem;
      }

      .news-card {
        padding: 1.25rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.75rem;
        background: #fff;
        box-shadow: 0 2px 8px rgb(15 23 42 / 8%);
      }

      .news-card h3 {
        margin-top: 0;
        text-transform: capitalize;
      }

      .news-card p {
        margin-bottom: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Proyek dan Artikel Profil</h1>
      <p>
        Data dari berkas JSON lokal dimuat menggunakan Fetch API dan ditampilkan
        sebagai kartu.
      </p>
    </header>

    <main>
      <section aria-labelledby="news-heading">
        <h2 id="news-heading">Daftar proyek dan artikel</h2>
        <p id="status-state" role="status" aria-live="polite"></p>
        <div id="list"></div>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
